# Netlify config — tells Netlify how to serve this static site
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "."           # serve files from the repo root
  command = ""            # no build step — pure HTML/CSS

# Sensible cache + security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Content Security Policy — defense in depth against XSS / supply-chain attacks.
    # Only the Google Fonts CDN is allowed for fonts/styles; everything else must be self-hosted.
    Content-Security-Policy = "default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.