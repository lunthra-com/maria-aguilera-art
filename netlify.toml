# Netlify config — tells Netlify how to serve this static site
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "."           # serve files from the repo root
  command = ""            # no build step — pure HTML/CSS

# Sensible cache + security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Long cache for static images (they rarely change once uploaded)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache HTML — so updates show up immediately on next visit
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
